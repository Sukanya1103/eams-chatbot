# src/main/resources/application.properties

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=eams

server.port=8081

# Used by JwtTokenProvider
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=28800000
jwt.refresh-token-expiry-ms=604800000

cors.allowed-origin=http://localhost:3000

# Temporary: disable Spring AI's vector store auto-config until the
# chatbot module is built and an EmbeddingModel bean actually exists.
# Remove this line when we get to the chatbot/RAG work.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.mongodb.autoconfigure.MongoDBAtlasVectorStoreAutoConfiguration